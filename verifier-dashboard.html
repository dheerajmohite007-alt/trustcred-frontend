
<script>
        async function verifyCredential() {
            const inputId = document.getElementById('verifyId').value.trim();
            const outputBox = document.getElementById('outputBox');
            outputBox.classList.remove('hidden');

            if (!inputId) {
                outputBox.className = "p-4 rounded-lg border bg-yellow-50 border-yellow-200 text-yellow-800";
                outputBox.innerHTML = "<strong>Warning:</strong> Please enter a valid Credential ID.";
                return;
            }

            // Show loading state while talking to the Java backend
            outputBox.className = "p-4 rounded-lg border bg-slate-50 border-slate-200 text-slate-700";
            outputBox.innerHTML = "Checking with Java backend database...";

            try {
                // Send request to your local Java HttpServer
                const response = await fetch('http://localhost:8080/api/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credentialId: inputId })
                });

                const resultText = await response.text();

                if (resultText === 'VERIFIED') {
                    outputBox.className = "p-4 rounded-lg border bg-green-50 border-green-200 text-green-900";
                    outputBox.innerHTML = `
                        <h3 class="font-bold text-lg mb-1">✓ CERTIFICATE GENUINE (VERIFIED)</h3>
                        <p class="text-xs text-slate-600 mb-2">Matched with official Java MySQL database records.</p>
                        <hr class="my-2 border-green-200">
                        <p class="text-xs font-mono text-slate-500 mt-2">Checked ID: ${inputId}</p>
                    `;
                } else if (resultText === 'REVOKED') {
                    outputBox.className = "p-4 rounded-lg border bg-orange-50 border-orange-200 text-orange-900";
                    outputBox.innerHTML = `
                        <h3 class="font-bold text-lg mb-1">⚠ CERTIFICATE REVOKED</h3>
                        <p class="text-xs text-orange-700">This certificate was active previously but has been revoked by the issuer.</p>
                        <p class="text-xs font-mono text-slate-500 mt-2">Checked ID: ${inputId}</p>
                    `;
                } else {
                    outputBox.className = "p-4 rounded-lg border bg-red-50 border-red-200 text-red-900";
                    outputBox.innerHTML = `
                        <h3 class="font-bold text-lg mb-1">✗ INVALID OR FAKE CERTIFICATE</h3>
                        <p class="text-xs text-red-700">No matching record found in the backend MySQL database.</p>
                        <p class="text-xs font-mono text-slate-500 mt-2">Checked ID: ${inputId}</p>
                    `;
                }
            } catch (error) {
                console.error("Backend connection error:", error);
                outputBox.className = "p-4 rounded-lg border bg-red-50 border-red-200 text-red-900";
                outputBox.innerHTML = `
                    <h3 class="font-bold text-lg mb-1">Connection Error</h3>
                    <p class="text-xs text-red-700">Could not connect to the Java backend server. Make sure Server.java is running on port 8080.</p>
                `;
            }
        }
    </script>
