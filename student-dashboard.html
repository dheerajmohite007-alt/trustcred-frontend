<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustCred - Student Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <div class="w-64 bg-slate-900 text-white p-6 hidden md:block">
            <h2 class="text-2xl font-bold mb-8 text-blue-400">🛡️ TrustCred</h2>
            <nav class="space-y-4 font-medium">
                <a href="#" class="block py-2.5 px-4 rounded bg-blue-600 text-white">Dashboard</a>
                <a href="#credentials" class="block py-2.5 px-4 rounded hover:bg-slate-800 text-slate-300">My Credentials</a>
                <a href="#profile" class="block py-2.5 px-4 rounded hover:bg-slate-800 text-slate-300">Profile</a>
                <a href="login.html" class="block py-2.5 px-4 rounded hover:bg-red-600 text-red-400 mt-20">Logout</a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-y-auto">
            <header class="bg-white shadow-sm p-6 flex justify-between items-center">
                <h1 class="text-xl font-bold text-slate-800">Student Dashboard</h1>
                <span class="text-sm bg-blue-100 text-blue-700 px-3 py-1 rounded-full font-medium">Role: Student</span>
            </header>

            <main class="p-8">
                <!-- Overview Cards -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <p class="text-sm text-slate-500 font-medium">Total Credentials</p>
                        <h3 class="text-3xl font-bold text-slate-900 mt-2">3</h3>
                    </div>
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <p class="text-sm text-slate-500 font-medium">Verified Credentials</p>
                        <h3 class="text-3xl font-bold text-green-600 mt-2">3</h3>
                    </div>
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <p class="text-sm text-slate-500 font-medium">Pending/Recent</p>
                        <h3 class="text-3xl font-bold text-blue-600 mt-2">1</h3>
                    </div>
                </div>

                <!-- My Credentials Section -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                    <h3 class="text-lg font-bold text-slate-800 mb-4">Issued Credentials</h3>
                    <div class="border rounded-lg p-4 flex justify-between items-center bg-slate-50">
                        <div>
                            <h4 class="font-bold text-slate-800">B.Tech Computer Science Degree</h4>
                            <p class="text-sm text-slate-500">Issued by: Mumbai University | ID: TC-99281-CS</p>
                            <span class="inline-block mt-2 text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded font-semibold">Status: VERIFIED</span>
                        </div>
                        <button class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition" onclick="alert('Showing QR Code for Credential Verification!')">View QR / Share</button>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
